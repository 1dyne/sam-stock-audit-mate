# 셈 앱(web/)을 GitHub Pages에 올린다. 저장소 Settings › Pages › Source를 "GitHub Actions"로 한 번 바꿔야 동작한다.
name: Pages
on:
  push:
    branches: [main, claude/trusting-allen-aptdba]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
