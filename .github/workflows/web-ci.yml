name: Web CI
on:
  push:
    paths: ['web/**', 'server/**', 'tests/**', 'package.json', '.github/workflows/web-ci.yml']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: 앱 끝-끝 테스트 (연습용 저울)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: dist/e2e
